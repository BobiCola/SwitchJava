name: Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build Windows standalone JAR
        run: mvn --batch-mode -Pwindows-release clean verify
      - name: Smoke test packaged JavaFX UI
        timeout-minutes: 2
        shell: pwsh
        run: |
          java -cp "target/test-classes;target/SwitchJava-1.1.0-windows.jar" smg.switchjava.UiSmoke
          if ($LASTEXITCODE -ne 0) { throw 'UI smoke test failed' }
      - name: Checksum
        shell: pwsh
        run: |
          $file = 'target/SwitchJava-1.1.0-windows.jar'
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  SwitchJava-1.1.0-windows.jar" | Set-Content target/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: SwitchJava-windows
          path: |
            target/SwitchJava-1.1.0-windows.jar
            target/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME target/SwitchJava-1.1.0-windows.jar target/SHA256SUMS.txt --verify-tag --title "SwitchJava $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
